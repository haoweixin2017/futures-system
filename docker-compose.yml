version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citic_futures_app
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - FUTURES_MYSQL_HOST=mysql
      - FUTURES_REDIS_HOST=redis
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config
      - ./ctp_flow:/app/ctp_flow
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    container_name: citic_futures_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: citic_futures_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${FUTURES_MYSQL_PASSWORD:?请在 .env 中配置 FUTURES_MYSQL_PASSWORD}
      MYSQL_DATABASE: citic_futures
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  mysql_data:
