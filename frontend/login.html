<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 国内期货实时监控系统</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1b1e24;
            --text-color: #e2e8f0;
            --text-muted: #8492a6;
            --border-color: #2b303c;
            --accent: #2563eb;
            --error: #ef4444;
            --live: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px 28px;
        }
        .logo { font-size: 17px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }

        /* 登录入口选择 */
        .entry-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
        .entry-btn {
            border: 1px solid var(--border-color);
            background: #232731;
            border-radius: 10px;
            padding: 14px 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .entry-btn .t { font-size: 14px; font-weight: bold; color: var(--text-color); display: block; margin-bottom: 4px; }
        .entry-btn .d { font-size: 11px; color: var(--text-muted); display: block; line-height: 1.5; }
        .entry-btn.active-sim { border-color: #2563eb; background: rgba(37, 99, 235, 0.12); }
        .entry-btn.active-sim .t { color: #60a5fa; }
        .entry-btn.active-live { border-color: var(--live); background: rgba(220, 38, 38, 0.12); }
        .entry-btn.active-live .t { color: #f87171; }

        label { display: block; font-size: 12px; color: var(--text-muted); margin: 14px 0 6px; }
        input {
            width: 100%;
            background: #232731;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        button.login-submit {
            width: 100%;
            margin-top: 22px;
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-sim { background: var(--accent); }
        .btn-live { background: var(--live); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            display: none;
            margin-top: 14px;
            color: var(--error);
            font-size: 12px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            padding: 8px 10px;
            line-height: 1.6;
        }
        .dest-hint {
            margin-top: 14px;
            font-size: 11px;
            color: var(--text-muted);
            background: #232731;
            border-radius: 6px;
            padding: 8px 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">国内期货实时监控与客观规则分析</div>
        <div class="sub" id="login-subtitle">当前仅开放模拟用户登录</div>

        <div class="entry-grid">
            <div class="entry-btn active-sim" id="entry-sim" onclick="pickEntry('sim')">
                <span class="t">模拟用户登录</span>
                <span class="d">进入模拟交易页<br>100万模拟资金 · 本地撮合</span>
            </div>
            <div class="entry-btn" id="entry-live" onclick="pickEntry('live')" style="display:none">
                <span class="t">实盘交易登录</span>
                <span class="d">进入实盘交易页<br>CTP柜台直连 · 真实资金</span>
            </div>
        </div>

        <form onsubmit="return doLogin(event)">
            <label>用户名</label>
            <input id="username" autocomplete="username" placeholder="请输入用户名">
            <label>密码</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
            <button id="login-btn" class="login-submit btn-sim" type="submit">登录模拟交易</button>
        </form>
        <div class="error-msg" id="error-msg"></div>
        <div class="dest-hint" id="dest-hint">模拟用户登录后将进入「模拟交易页」, 仅可使用模拟资金交易, 无法触及实盘接口。</div>
    </div>

    <script>
        let entry = 'sim';   // 当前选择的登录入口: sim | live

        // 按登录入口分别记住用户名 (localStorage)
        function rememberedUsername(type) {
            try { return localStorage.getItem('cfs_username_' + type) || ''; } catch (e) { return ''; }
        }

        function pickEntry(type) {
            entry = type;
            const simBtn = document.getElementById('entry-sim');
            const liveBtn = document.getElementById('entry-live');
            const btn = document.getElementById('login-btn');
            const hint = document.getElementById('dest-hint');
            simBtn.className = 'entry-btn' + (type === 'sim' ? ' active-sim' : '');
            liveBtn.className = 'entry-btn' + (type === 'live' ? ' active-live' : '');
            btn.className = type === 'sim' ? 'login-submit btn-sim' : 'login-submit btn-live';
            btn.innerText = type === 'sim' ? '登录模拟交易' : '登录实盘交易';
            hint.innerText = type === 'sim'
                ? '模拟用户登录后将进入「模拟交易页」, 仅可使用模拟资金交易, 无法触及实盘接口。'
                : '正式用户登录后将进入「实盘交易页」, 报单直达 CTP 实盘柜台 (柜台连接后方可报单), 同时也可访问模拟交易页。';
            // 回填该入口上次登录的用户名; 无记录则清空, 避免串用其他入口的账号
            document.getElementById('username').value = rememberedUsername(type);
            if (rememberedUsername(type)) {
                document.getElementById('password').focus();
            }
        }

        async function doLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('error-msg');
            errBox.style.display = 'none';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                errBox.innerText = '请输入用户名和密码';
                errBox.style.display = 'block';
                return false;
            }
            btn.disabled = true;
            btn.innerText = '登录中...';
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, expected_role: entry })
                });
                if (res.ok) {
                    // 记住该入口本次登录的用户名 (不记住密码)
                    try { localStorage.setItem('cfs_username_' + entry, username); } catch (e) {}
                    // 入口与角色已经后端校验一致, 按入口进入对应交易页
                    window.location.href = entry === 'live' ? '/live' : '/paper';
                    return false;
                }
                const data = await res.json().catch(() => ({}));
                errBox.innerText = data.detail || '登录失败, 请稍后重试';
                errBox.style.display = 'block';
            } catch (e) {
                errBox.innerText = '网络错误, 无法连接服务';
                errBox.style.display = 'block';
            }
            btn.disabled = false;
            btn.innerText = entry === 'sim' ? '登录模拟交易' : '登录实盘交易';
            return false;
        }

        // 页面加载时应用默认入口；只有后端明确启用 CTP 时才显示实盘入口。
        pickEntry('sim');
        fetch('/api/v1/health').then(res => res.json()).then(data => {
            if (data.feeds && data.feeds.live === 'ctp') {
                document.getElementById('entry-live').style.display = '';
                document.querySelector('.entry-grid').style.gridTemplateColumns = '1fr 1fr';
                document.getElementById('login-subtitle').innerText = '请选择登录入口 — 不同入口进入不同交易页面';
            }
        }).catch(() => {});
    </script>
</body>
</html>
